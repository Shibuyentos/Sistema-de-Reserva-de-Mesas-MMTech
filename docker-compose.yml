version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mmtech_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker_password
      POSTGRES_DB: mmtech_reservas
    ports:
      # Mapeando porta 5433 do host para 5432 do container
      # Isso evita conflito caso você tenha um Postgres local rodando na 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script para criar tabelas automaticamente na primeira execução
      - ./database/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
